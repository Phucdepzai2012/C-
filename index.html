:var(--muted)}.drop{border:2px dashed #c7d2e9;background:#fbfcff;border-radius:19px;padding:31px;text-align:center;transition:.2s}.drop.drag{border-color:#4d82ff;background:#edf4ff;transform:scale(1.005)}.drop strong{font-size:17px;display:block;margin-bottom:6px}.drop p{margin:0 0 15px;color:var(--muted);font-size:13px}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}.file-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 5px 15px rgba(36,49,76,.04)}.file-icon{width:43px;height:43px;flex:0 0 auto;border-radius:12px;background:#f1f4f9;display:grid;place-items:center;font-size:20px}.file-info{min-width:0;flex:1}.file-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.55}.file-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.progress{margin-top:11px;height:7px;background:#eef1f7;border-radius:99px;overflow:hidden}.progress>span{height:100%;display:block;background:linear-gradient(90deg,#1967ff,#5f5aff);width:0;transition:width .1s}.upload-status{font-size:12px;margin-top:7px;color:#5f6a82}.userbox{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid var(--line);border-radius:13px;background:#fff}.userbox .u-text{min-width:0;flex:1}.userbox b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userbox span{font-size:10px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.backdrop{position:fixed;inset:0;background:rgba(10,16,31,.52);backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;padding:18px}.modal{width:min(620px,100%);background:#fff;border-radius:21px;box-shadow:0 30px 90px rgba(0,0,0,.25);padding:21px;max-height:90vh;overflow:auto}.modal h3{margin:0 0 14px;font-size:20px}.modal-head{display:flex <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, signInAnonymously, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, push, remove, onValue, onDisconnect, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDQsJ_NrGK5ouRLS7vFr55OBZQ0nKhHSk",
  authDomain: "vietnam-life-game.firebaseapp.com",
  databaseURL: "https://vietnam-life-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vietnam-life-game",
  storageBucket: "vietnam-life-game.firebasestorage.app",
  messagingSenderId: "134954120781",
  appId: "1:134954120781:web:d7f762adb80bfce3140e04",
  measurementId: "G-39VPPE1F9T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
await setPersistence(auth, browserLocalPersistence).catch(()=>{});

const ROOM_SAMPLE = "PHONGMAU";
const SAMPLE_PASSWORD = "123456";
const SAMPLE_SALT = "roomdrive-sample-v1";
const SAMPLE_HASH = "ea396cab4e47630645d438e40453bcd2ef6686b81ca934bbfb80f5302a6b058a";
const CHUNK_SIZE = 64 * 1024;
const MAX_RETRIES = 3;
const WRITE_TIMEOUT = 18000;
const state = { user:null, rooms:{}, joined:null, unsubRooms:null, unsubMeta:null, unsubFiles:null, query:"", busy:false };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>'"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
const fmtSize = n => { if(n<1024)return n+" B"; if(n<1024*1024)return (n/1024).toFixed(n<10240?1:0)+" KB"; if(n<1024**3)return (n/1024**1024).toFixed(1)+" MB"; return (n/1024**3).toFixed(2)+" GB"; };
const fmtDate = n => { if(!n)return "Chưa rõ thời gian"; const d=new Date(n); return d.toLocaleString("vi-VN",{dateStyle:"medium",timeStyle:"short"}); };
const nowish = () => Date.now();
const randomChars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function randomCode(len=8){let out="";const a=new Uint32Array(len);crypto.getRandomValues(a);for(const x of a)out+=randomChars[x%randomChars.length];return out;}
function normalizeRoomCode(v){return String(v||"").trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"");}
async function sha256(text){const b=new TextEncoder().encode(text);const h=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function hashPassword(password,salt=crypto.randomUUID()){return salt+"$"+(await sha256(salt+"\0"+password));}
async function verifyPassword(password,stored){const [salt,hash]=String(stored||"").split("$");if(!salt||!hash)return false;return (await sha256(salt+"\0"+password))===hash;}
function toast(msg,type=""){const el=document.createElement("div");el.className="toast "+type;el.textContent=msg;$('toastWrap').appendChild(el);setTimeout(()=>el.remove(),4300);}
function iconFor(name,type=""){const n=String(name||"").toLowerCase();if(type.startsWith("image/")||/\.(png|jpe?g|gif|webp|svg)$/i.test(n))return "🖼️";if(type.includes("pdf")||/\.pdf$/i.test(n))return "📕";if(type.includes("zip")||/\.(zip|rar|7z)$/i.test(n))return "🗜️";if(type.startsWith("video/")||/\.(mp4|mov|avi|mkv|webm)$/i.test(n))return "🎬";if(type.startsWith("audio/")||/\.(mp3|wav|ogg|m4a)$/i.test(n))return "🎵";if(type.includes("text")||/\.(txt|md|json|js|html|css|csv)$/i.test(n))return "📄";if(/\.(doc|docx)$/i.test(n))return "📝";if(/\.(xls|xlsx)$/i.test(n))return "📊";if(/\.(ppt|pptx)$/i.test(n))return "📽️";return "📦";}
function humanError(e){const c=e?.code||"";const map={"auth/popup-blocked":"Popup Google bị trình duyệt chặn.","auth/popup-closed-by-user":"Bạn đã đóng cửa sổ Google.","auth/unauthorized-domain":"Domain hiện tại chưa được thêm vào Authorized domains của Firebase.","auth/operation-not-allowed":"Firebase chưa bật phương thức đăng nhập này.","auth/network-request-failed":"Mạng gặp lỗi khi kết nối Firebase.","PERMISSION_DENIED":"Firebase Realtime Database bị từ chối quyền.","permission-denied":"Firebase Realtime Database bị từ chối quyền."};return map[c]||e?.message||String(e);}
async function withTimeout(p,ms){let t;return Promise.race([p, new Promise((_,rej)=>t=setTimeout(()=>rej(new Error("TIMEOUT")),ms))]).finally(()=>clearTimeout(t));}
async function setWithRetry(path,value,label,onRetry){let last;for(let attempt=1;attempt<=MAX_RETRIES;attempt++){try{return await withTimeout(set(ref(db,path),value),WRITE_TIMEOUT);}catch(e){last=e;if(attempt<MAX_RETRIES){onRetry?.(attempt,e);await new Promise(r=>setTimeout(r,Math.min(1200*attempt,3000)));}}}throw last;}
async function ensureSampleRoom(){
  const metaRef=ref(db,`rooms/${ROOM_SAMPLE}/meta`);
  try{
    await runTransaction(metaRef,current=>current || {roomId:ROOM_SAMPLE,roomName:"PHÒNG MẪU",passwordHash:`${SAMPLE_SALT}$${SAMPLE_HASH}`,ownerUid:"SYSTEM_SAMPLE",ownerEmail:"sample@roomdrive.local",ownerName:"RoomDrive",createdAt:nowish(),updatedAt:nowish(),allowUploads:true,isSample:true});
    const filesSnap=await get(ref(db,`rooms/${ROOM_SAMPLE}/filesMeta`));
    if(!filesSnap.exists()){
      const id="readme";const content="RoomDrive – README.txt\n\nĐây là phòng mẫu để kiểm tra upload/download.\nMã phòng: PHONGMAU\nMật khẩu: 123456\n";const bytes=new TextEncoder().encode(content);let bin="";for(const b of bytes)bin+=String.fromCharCode(b);const b64=btoa(bin);await set(ref(db,`rooms/${ROOM_SAMPLE}/fileData/${id}/0`),b64);await set(ref(db,`rooms/${ROOM_SAMPLE}/filesMeta/${id}`),{name:"README.txt",size:bytes.length,contentType:"text/plain",totalChunks:1,chunkSize:CHUNK_SIZE,createdAt:nowish(),uploaderUid:"SYSTEM_SAMPLE",uploaderName:"RoomDrive"});
    }
  }catch(e){ console.warn("Sample init",e); if(e?.code==="PERMISSION_DENIED"||e?.message?.includes("PERMISSION")) toast("❌ Firebase Database bị từ chối quyền khi tạo PHÒNG MẪU","bad"); }
}

function renderLogin(){
  $('app').innerHTML=`<main class="login"><section class="login-card"><div class="logo">R</div><h1>RoomDrive</h1><p>Lưu và chia sẻ file theo từng phòng, chạy trực tiếp trên trình duyệt với Firebase Realtime Database.</p><div class="sample-note"><b>Phòng mẫu:</b> PHONGMAU &nbsp;•&nbsp; <b>Mật khẩu:</b> 123456</div><button class="google-btn" id="googleLogin">🔐 Đăng nhập bằng Google</button><div class="or">HOẶC</div><button class="btn outline" style="width:100%" id="guestJoin">🚪 Tham gia phòng mẫu / phòng khác</button><p class="mini" style="margin-top:15px">Bạn có thể dùng tài khoản Google cho phòng riêng hoặc tài khoản khách cho việc tham gia.</p></section></main>`;
  $('googleLogin').onclick=googleLogin;
  $('guestJoin').onclick=()=>openJoinModal();
}

function renderApp(){
  const u=state.user; const display=esc(u?.displayName||"Khách"); const email=esc(u?.email||"Tài khoản khách");
  $('app').innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="logo">R</div><div><h1>RoomDrive</h1><small>Cloud rooms made simple</small></div></div><div class="search"><span>⌕</span><input id="search" placeholder="Tìm phòng hoặc file..." autocomplete="off"></div><div class="top-actions"><button class="btn primary" id="createRoom">＋ Tạo phòng</button><button class="btn ghost" id="joinRoom">＋ Tham gia</button><img class="avatar" id="topAvatar" src="${esc(u?.photoURL||"")}" onerror="this.style.display='none'" alt="Avatar"><button class="btn outline" id="logout">Đăng xuất</button></div></header><div class="layout"><aside class="sidebar"><button class="side-btn active" id="navRooms">🏠 Phòng của tôi</button><button class="side-btn" id="navSample">🧪 Phòng mẫu</button><button class="side-btn" id="navJoin">🚪 Tham gia phòng</button><div class="side-label">Tài khoản</div><div class="userbox"><img class="avatar" src="${esc(u?.photoURL||"")}" onerror="this.style.display='none'" alt=""><div class="u-text"><b>${display}</b><span>${email}</span></div></div></aside><main class="content" id="main"></main></div></div>`;
  $('logout').onclick=async()=>{try{await signOut(auth);state.joined=null;toast("✅ Đã đăng xuất","good");}catch(e){toast("❌ "+humanError(e),"bad");}};
  $('createRoom').onclick=openCreateModal;$('joinRoom').onclick=openJoinModal;$('navJoin').onclick=openJoinModal;$('navSample').onclick=()=>enterRoom(ROOM_SAMPLE);$('navRooms').onclick=showHome;$('search').oninput=e=>{state.query=e.target.value;showHome();};showHome();

function showHome(){if(state.joined){showRoom();return;}const q=state.query.toLowerCase();const rooms=Object.values(state.rooms).filter(r=>`${r.roomName} ${r.roomId}`.toLowerCase().includes(q));

function openCreateModal(){
  if(!state.user||state.user.isAnonymous){toast("❌ Hãy đăng nhập Google để tạo phòng.","bad");return;}
  const code=randomCode(8);openModal(`<div class="modal-head"><h3>＋ Tạo phòng mới</h3><button class="x" id="close">✕</button></div><div class="field"><label>Mã phòng (tự tạo)</label><input id="newCode" value="${code}" maxlength="8" style="text-transform:uppercase"></div><div class="field"><label>Tên phòng</label><input id="newName" value="Phòng mới" maxlength="80"></div><div class="row"><div class="field"><label>Mật khẩu</label><div style="display:flex;gap:7px"><input id="newPass" value="${randomCode(10)}" type="password"><button class="btn outline small" id="togglePass">👁</button></div></div><div class="field"><label>Cho thành viên upload</label><label class="toggle" style="height:43px"><span class="mini">Có / Không</span><input id="allowUploads" type="checkbox" checked></label></div></div><div class="modal-actions"><button class="btn outline" id="cancel">Hủy</button><button class="btn primary" id="saveRoom">Tạo phòng</button></div>`);$('close').onclick=closeModal;$('cancel').onclick=closeModal;$('togglePass').onclick=()=>{const p=$('newPass');p.type=p.type==='password'?'text':'password';};$('saveRoom').onclick=createRoom;

async function createRoom(){const btn=$('saveRoom');btn.disabled=true;btn.innerHTML=`<span class="spinner"></span> Đang tạo...`;try{const roomId=normalizeRoomCode($('newCode').value)||randomCode();if(roomId.length<6||roomId.length>8)throw new Error("Mã phòng phải dài 6–8 ký tự.");const exists=await get(ref(db,`rooms/${roomId}/meta`));if(exists.exists())throw new Error("Mã phòng đã tồn tại, hãy tạo lại.");const roomName=$('newName').value.trim()||"Phòng mới";const pass=$('newPass').value;if(pass.length<4)throw new Error("Mật khẩu phải có ít nhất 4 ký tự.");const passwordHash=await hashPassword(pass);const ts=nowish();const data={roomId,roomName,passwordHash,ownerUid:state.user.uid,ownerEmail:state.user.email||"",ownerName:state.user.displayName||"",createdAt:ts,updatedAt:ts,allowUploads:$('allowUploads').checked};const updates={};updates[`rooms/${roomId}/meta`]=data;updates[`users/${state.user.uid}/rooms/${roomId}`]=data;await update(ref(db),updates);closeModal();toast("✅ Tạo phòng thành công","good");await enterRoom(roomId,true);}catch(e){toast("❌ "+humanError(e),"bad");btn.disabled=false;btn.textContent="Tạo phòng";}}

function openJoinModal(prefill=""){openModal(`<div class="modal-head"><h3>🚪 Tham gia phòng</h3><button class="x" id="close">✕</button></div><div class="field"><label>Mã phòng</label><input id="joinCode" value="${esc(prefill)}" placeholder="Ví dụ: X8K2P9Q1" maxlength="8" style="text-transform:uppercase"></div><div class="field"><label>Mật khẩu</label><div style="display:flex;gap:7px"><input id="joinPass" type="password" placeholder="Mật khẩu phòng"><button class="btn outline small" id="joinEye">👁</button></div></div><div class="mini">Khách có thể dùng Anonymous Auth; không cần Gmail để tham gia phòng.</div><div class="modal-actions"><button class="btn outline" id="cancel">Hủy</button><button class="btn primary" id="doJoin">Vào phòng</button></div>`);$('close').onclick=closeModal;$('cancel').onclick=closeModal;$('joinEye').onclick=()=>{const p=$('joinPass');p.type=p.type==='password'?'text':'password';};$('doJoin').onclick=joinRoom;}
async function ensureAuthForJoin(){if(auth.currentUser)return auth.currentUser;try{const c=await signInAnonymously(auth);return c.user;}catch(e){throw new Error("Không thể đăng nhập Anonymous. Hãy bật Anonymous provider trong Firebase Authentication.");}}
async function joinRoom(){const btn=$('doJoin');btn.disabled=true;btn.innerHTML=`<span class="spinner"></span> Đang kiểm tra...`;try{const code=normalizeRoomCode($('joinCode').value);const pass=$('joinPass').value;if(!code)throw new Error("❌ Không tìm thấy phòng");const snap=await get(ref(db,`rooms/${code}/meta`));if(!snap.exists())throw new Error("❌ Không tìm thấy phòng");const meta=snap.val();if(!(await verifyPassword(pass,meta.passwordHash)))throw new Error("❌ Sai mật khẩu");await ensureAuthForJoin();const session={uid:auth.currentUser.uid,roomId:code,version:meta.updatedAt||meta.createdAt||1,expiresAt:Date.now()+7*24*3600*1000};await set(ref(db,`roomAccess/${auth.currentUser.uid}/${code}`),session);closeModal();toast("✅ Vào phòng thành công","good");await enterRoom(code,true);}catch(e){toast(humanError(e),"bad");btn.disabled=false;btn.textContent="Vào phòng";}}

async function enterRoom(roomId,fromAction=false){roomId=normalizeRoomCode(roomId);if(state.unsubMeta)state.unsubMeta();if(state.unsubFiles)state.unsubFiles();state.joined=null;try{
  let u=auth.currentUser;if(!u)u=await ensureAuthForJoin();const metaSnap=await get(ref(db,`rooms/${roomId}/meta`));if(!metaSnap.exists()){toast("❌ Không tìm thấy phòng","bad");return;}const meta=metaSnap.val();if(meta.ownerUid!==u.uid){const a=await get(ref(db,`roomAccess/${u.uid}/${roomId}`));if(!a.exists()||Number(a.val().expiresAt||0)<=Date.now()){openJoinModal(roomId);return;}}
  state.joined={roomId,meta,files:{}};showRoom();
  state.unsubMeta=onValue(ref(db,`rooms/${roomId}/meta`),snap=>{if(!snap.exists()){toast("Phòng đã bị xóa","bad");state.joined=null;showHome();return;}state.joined.meta=snap.val();showRoom();});
  state.unsubFiles=onValue(ref(db,`rooms/${roomId}/filesMeta`),snap=>{state.joined.files=snap.val()||{};showRoom();});
}catch(e){toast("❌ "+humanError(e),"bad");}}
function showRoom(){if(!state.joined){showHome();return;}const r=state.joined.meta;const isOwner=state.user&&r.ownerUid===state.user.uid;const canUpload=isOwner||r.allowUploads!==false;const all=Object.values(state.joined.files||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));const q=state.query.toLowerCase();const files=q?all.filter(f=>`${f.name} ${f.uploaderName}`.toLowerCase().includes(q)):all;
  $('main').innerHTML=`<section class="section"><div class="room-view"><div class="room-view-head"><div><h2>${esc(r.roomName)}</h2><p>Mã phòng: <b>${esc(r.roomId)}</b> · Chủ phòng: ${esc(r.ownerName||r.ownerEmail||"")}</p><p style="margin-top:4px">${isOwner?'👑 Bạn là chủ phòng':(canUpload?'👤 Thành viên · được upload':'👤 Thành viên · chỉ xem')}</p></div><div class="room-tools"><button class="btn outline small" id="copyRoom">Copy mã</button><button class="btn outline small" id="copyLink">🔗 Copy link</button>${isOwner?'<button class="btn outline small" id="editRoom">⚙️ Cài đặt</button>':''}<button class="btn outline small" id="backHome">← Phòng của tôi</button></div></div>${canUpload?`<div class="drop" id="drop"><strong>📤 Kéo & thả file vào đây</strong><p>File được chia thành chunk ~64 KB và ghi tuần tự vào Firebase Realtime Database.</p><button class="btn primary" id="pick">Chọn file</button><input id="fileInput" type="file" multiple hidden></div>`:`<div class="drop"><strong>👀 Phòng đang ở chế độ chỉ xem</strong><p>Chỉ chủ phòng mới có thể đổi quyền upload.</p></div>`}<div class="section-head" style="margin-top:22px"><div><div class="section-title">Tệp trong phòng</div><div class="sub">${files.length} tệp · realtime</div></div></div><div class="file-grid">${files.length?files.map(f=>fileCard(f,isOwner)).join(""):`<div class="empty" style="grid-column:1/-1">Chưa có file.</div>`}</div></div></section>`;
  $('backHome').onclick=()=>{state.joined=null;if(state.unsubMeta)state.unsubMeta();if(state.unsubFiles)state.unsubFiles();showHome();};$('copyRoom').onclick=()=>navigator.clipboard?.writeText(r.roomId).then(()=>toast("✅ Đã copy mã phòng","good"));$('copyLink').onclick=()=>navigator.clipboard?.writeText(location.href.split('#')[0]+`#room=${encodeURIComponent(r.roomId)}`).then(()=>toast("✅ Đã copy link phòng","good"));if(isOwner)$('editRoom').onclick=()=>openEditRoom();if(canUpload){$('pick').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{for(const f of e.target.files)uploadFile(f);};setupDrop();}
  document.querySelectorAll("[data-download]").forEach(b=>b.onclick=()=>downloadFile(b.dataset.download));document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>viewFile(b.dataset.view));document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>copyText(getFileLink(r.roomId,b.dataset.share),"✅ Đã copy link file"));document.querySelectorAll("[data-open-link]").forEach(b=>b.onclick=()=>{location.href=getFileLink(r.roomId,b.dataset.openLink);});if(isOwner)document.querySelectorAll("[data-file-delete]").forEach(b=>b.onclick=()=>deleteFile(b.dataset.fileDelete));
}
function getFileLink(roomId,fileId){return location.href.split("#")[0]+"#/file/"+encodeURIComponent(roomId)+"/"+encodeURIComponent(fileId);}
function copyText(text,ok="✅ Đã copy link"){return navigator.clipboard?.writeText(text).then(()=>toast(ok,"good")).catch(()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast(ok,"good");});}
function fileCard(f,isOwner){const link=getFileLink(state.joined.roomId,f.fileId);return `<article class="file-card"><div class="file-icon">${iconFor(f.name,f.contentType)}</div><div class="file-info"><div class="file-name" title="${esc(f.name)}">${esc(f.name)}</div><div class="file-meta">${fmtSize(Number(f.size||0))} · ${esc(f.uploaderName||"Không rõ")}<br>${esc(fmtDate(f.createdAt))}</div><div class="file-actions"><button class="btn outline small" data-view="${esc(f.fileId)}">👁 Xem</button><button class="btn primary small" data-download="${esc(f.fileId)}">⬇ Tải</button><button class="btn ghost small" data-share="${esc(f.fileId)}">🔗 Link</button><button class="btn outline small" data-open-link="${esc(f.fileId)}">↗ Mở link</button>${isOwner?`<button class="btn danger small" data-file-delete="${esc(f.fileId)}">🗑</button>`:""}</div><div class="share-box"><div class="mini">Link file riêng</div><div class="share-url">${esc(link)}</div></div></div></article>`;}
function setupDrop(){const d=$('drop');d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};d.ondragleave=()=>d.classList.remove('drag');d.ondrop=e=>{e.preventDefault();d.classList.remove('drag');for(const f of e.dataTransfer.files)uploadFile(f)};}
async function uploadFile(file){if(!state.joined)return;const r=state.joined.meta;const u=auth.currentUser;if(!u){toast("❌ Chưa đăng nhập","bad");return;}const fileId=push(ref(db,`rooms/${r.roomId}/filesMeta`)).key;const totalChunks=Math.max(1,Math.ceil(file.size/CHUNK_SIZE));const boxId=`upload_${fileId}`;const drop=$('drop');const wrap=document.createElement('div');wrap.className='setting-card';wrap.id=boxId;wrap.innerHTML=`<div class="toggle"><div><b>${esc(file.name)}</b><div class="mini">0 / ${totalChunks} chunk · 0%</div></div><span class="mini" id="status_${fileId}">Đang chuẩn bị...</span></div><div class="progress"><span id="bar_${fileId}"></span></div><div class="upload-status" id="msg_${fileId}"></div>`;drop.after(wrap);
  let saved=0;const updateUI=(msg)=>{const p=Math.floor(saved/totalChunks*100);const bar=$(`bar_${fileId}`),st=$(`status_${fileId}`),ms=$(`msg_${fileId}`);if(bar)bar.style.width=p+"%";if(st)st.textContent=`${saved} / ${totalChunks} chunk · ${p}%`;if(ms)ms.textContent=msg||"";};
  try{for(let i=0;i<totalChunks;i++){const blob=file.slice(i*CHUNK_SIZE,Math.min(file.size,(i+1)*CHUNK_SIZE));const buf=new Uint8Array(await blob.arrayBuffer());let binary="";const step=0x8000;for(let j=0;j<buf.length;j+=step)binary+=String.fromCharCode(...buf.subarray(j,j+step));const b64=btoa(binary);await setWithRetry(`rooms/${r.roomId}/fileData/${fileId}/${i}`,b64,`Chunk ${i+1}/${totalChunks}`,(attempt)=>updateUI(`Chunk ${i+1}/${totalChunks} thất bại – đang thử lại (lần ${attempt+1})...`));saved=i+1;updateUI(`Đã lưu chunk ${saved}/${totalChunks}`);}
    const meta={fileId,name:file.name,size:file.size,contentType:file.type||"application/octet-stream",totalChunks,chunkSize:CHUNK_SIZE,createdAt:nowish(),uploaderUid:u.uid,uploaderName:u.displayName||u.email||"Khách"};await setWithRetry(`rooms/${r.roomId}/filesMeta/${fileId}`,meta,"Metadata",()=>updateUI("Metadata lỗi – đang thử lại..."));updateUI("✅ Upload thành công");toast(`✅ ${file.name} đã upload thành công`,"good");setTimeout(()=>document.getElementById(boxId)?.remove(),2500);
  }catch(e){updateUI("❌ Upload thất bại sau 3 lần thử.");toast("❌ Upload thất bại: "+humanError(e),"bad");}}

function b64ToBytes(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function readFileBlob(meta){const parts=[];for(let i=0;i<meta.totalChunks;i++){const s=await get(ref(db,`rooms/${state.joined.roomId}/fileData/${meta.fileId}/${i}`));if(!s.exists())throw new Error(`Thiếu chunk ${i+1}/${meta.totalChunks}`);parts.push(b64ToBytes(s.val()));}return new Blob(parts,{type:meta.contentType||"application/octet-stream"});}
async function downloadFile(fileId){const meta=state.joined?.files?.[fileId];if(!meta)return;toast("Đang tải file...","good");try{const blob=await readFileBlob(meta);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=meta.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast("✅ Tải xuống thành công","good");}catch(e){toast("❌ Không thể tải: "+humanError(e),"bad");}}
async function viewFile(fileId){const meta=state.joined?.files?.[fileId];if(!meta)return;openViewerForMeta(state.joined.roomId,meta);}
async function openViewerForMeta(roomId,meta){openModal(`<div class="viewer"><div class="viewer-head"><div>${esc(meta.name)}</div><button class="x" id="closeViewer">✕</button></div><div class="viewer-body" id="viewerBody"><span style="color:#fff">Đang tải file...</span></div></div>`);$('closeViewer').onclick=closeModal;try{const blob=await readFileBlobFromRoom(roomId,meta);const url=URL.createObjectURL(blob);const body=$('viewerBody');const type=String(meta.contentType||'application/octet-stream').toLowerCase();const name=String(meta.name||'');if(type.startsWith('video/')){body.innerHTML=`<video src="${url}" controls autoplay playsinline preload="metadata"></video>`;}else if(type.startsWith('audio/')){body.innerHTML=`<audio src="${url}" controls autoplay></audio>`;}else if(type.startsWith('image/')){body.innerHTML=`<img src="${url}" alt="${esc(name)}">`;}else if(type==='application/pdf'||/\.pdf$/i.test(name)){body.innerHTML=`<iframe src="${url}" title="PDF"></iframe>`;}else if(type.startsWith('text/')||/\.(txt|md|json|csv|html|css|js|xml|log)$/i.test(name)){const text=await blob.text();body.innerHTML=`<pre>${esc(text)}</pre>`;}else if(/\.(doc|docx|xls|xlsx|ppt|pptx)$/i.test(name)){body.innerHTML=`<div class="viewer-office"><h2>📄 ${esc(name)}</h2><p>File Office đã được lưu thành công. Trình duyệt không có Word/Excel/PowerPoint engine tích hợp để chuyển đổi chính xác sang PDF.</p><p>Bạn có thể mở file bằng ứng dụng Office trên thiết bị hoặc tải file xuống.</p><button class="btn primary" id="downloadFromView">⬇ Tải xuống</button></div>`;}else{body.innerHTML=`<div style="color:#fff;text-align:center;padding:30px"><div style="font-size:52px">${iconFor(name,type)}</div><h3>${esc(name)}</h3><p>Trình duyệt không xem trực tiếp loại file này.</p><button class="btn primary" id="downloadFromView">⬇ Tải xuống</button></div>`;}if($('downloadFromView'))$('downloadFromView').onclick=()=>{closeModal();downloadFileFromRoom(roomId,meta);};}catch(e){$('viewerBody').innerHTML=`<span style="color:#ffadb8">❌ ${esc(humanError(e))}</span>`;}}
async function readFileBlobFromRoom(roomId,meta){const parts=[];for(let i=0;i<Number(meta.totalChunks||0);i++){const s=await get(ref(db,`rooms/${roomId}/fileData/${meta.fileId}/${i}`));if(!s.exists())throw new Error(`Thiếu chunk ${i+1}/${meta.totalChunks}`);parts.push(b64ToBytes(s.val()));}return new Blob(parts,{type:meta.contentType||"application/octet-stream"});}
async function downloadFileFromRoom(roomId,meta){toast("Đang tải file...","good");try{const blob=await readFileBlobFromRoom(roomId,meta);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=meta.name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast("✅ Tải xuống thành công","good");}catch(e){toast("❌ Không thể tải: "+humanError(e),"bad");}}
async function openSharedFileLink(roomId,fileId){roomId=normalizeRoomCode(roomId);if(!roomId||!fileId)return;try{const metaSnap=await get(ref(db,`rooms/${roomId}/meta`));if(!metaSnap.exists()){renderRouteError("❌ Không tìm thấy phòng");return;}const meta=metaSnap.val();const fileSnap=await get(ref(db,`rooms/${roomId}/filesMeta/${fileId}`));if(!fileSnap.exists()){renderRouteError("❌ Không tìm thấy file");return;}const fileMeta=fileSnap.val();const u=auth.currentUser||await ensureAuthForJoin();const owner=meta.ownerUid===u.uid;const a=await get(ref(db,`roomAccess/${u.uid}/${roomId}`));const accessOK=owner||(a.exists()&&Number(a.val().expiresAt||0)>Date.now()&&String(a.val().version)===String(meta.updatedAt||meta.createdAt));if(accessOK){await openViewerForMeta(roomId,fileMeta);return;}openSharedPasswordModal(roomId,meta,fileMeta);}catch(e){renderRouteError("❌ "+humanError(e));}}
function openSharedPasswordModal(roomId,roomMeta,fileMeta){openModal(`<div class="modal-head"><h3>🔐 Link file RoomDrive</h3></div><p style="color:#59647a;line-height:1.6">File <b>${esc(fileMeta.name)}</b> thuộc phòng <b>${esc(roomMeta.roomName)}</b>. Nhập mật khẩu phòng để xem file.</p><div class="field"><label>Mật khẩu phòng</label><div style="display:flex;gap:7px"><input id="sharedPass" type="password" placeholder="Nhập mật khẩu"><button class="btn outline small" id="sharedEye">👁</button></div></div><div class="share-box"><div class="mini">Link này có thể gửi cho người khác. Người nhận vẫn cần mật khẩu phòng.</div></div><div class="modal-actions"><button class="btn outline" id="sharedBack">Trang chủ</button><button class="btn primary" id="sharedOpen">🔓 Mở file</button></div>`);$('sharedEye').onclick=()=>{const x=$('sharedPass');x.type=x.type==='password'?'text':'password';};$('sharedBack').onclick=()=>{closeModal();location.hash="";handleRoute();};$('sharedOpen').onclick=async()=>{const btn=$('sharedOpen');btn.disabled=true;btn.textContent="Đang kiểm tra...";try{if(!(await verifyPassword($('sharedPass').value,roomMeta.passwordHash)))throw new Error("❌ Sai mật khẩu");const u=auth.currentUser||await ensureAuthForJoin();await set(ref(db,`roomAccess/${u.uid}/${roomId}`),{uid:u.uid,roomId,version:roomMeta.updatedAt||roomMeta.createdAt||1,expiresAt:Date.now()+7*24*3600*1000});closeModal();toast("✅ Xác thực thành công","good");await openViewerForMeta(roomId,fileMeta);}catch(e){toast(humanError(e),"bad");btn.disabled=false;btn.textContent="🔓 Mở file";}};}
function renderRouteError(message){$('app').innerHTML=`<main class="login"><section class="login-card"><div class="logo">R</div><h1>RoomDrive</h1><p>${esc(message)}</p><button class="btn primary" id="routeHome">← Về trang chủ</button></section></main>`;$('routeHome').onclick=()=>{location.hash="";handleRoute();};}


async function deleteFile(fileId){if(!confirm("Xóa file này khỏi phòng?"))return;const r=state.joined.meta;if(r.ownerUid!==auth.currentUser?.uid){toast("❌ Chỉ chủ phòng mới được xóa file","bad");return;}try{await remove(ref(db,`rooms/${r.roomId}/filesMeta/${fileId}`));await remove(ref(db,`rooms/${r.roomId}/fileData/${fileId}`));toast("✅ Đã xóa file","good");}catch(e){toast("❌ "+humanError(e),"bad");}}
async function deleteRoom(roomId){if(!confirm("Xóa phòng và toàn bộ dữ liệu file của phòng? Hành động này không thể hoàn tác."))return;try{await remove(ref(db,`users/${auth.currentUser.uid}/rooms/${roomId}`));await remove(ref(db,`rooms/${roomId}`));toast("✅ Đã xóa phòng","good");}catch(e){toast("❌ Không thể xóa: "+humanError(e),"bad");}}
function openEditRoom(){const r=state.joined.meta;openModal(`<div class="modal-head"><h3>⚙️ Cài đặt phòng</h3><button class="x" id="close">✕</button></div><div class="field"><label>Tên phòng</label><input id="editName" value="${esc(r.roomName)}" maxlength="80"></div><div class="field"><label>Mật khẩu mới (để trống nếu giữ nguyên)</label><div style="display:flex;gap:7px"><input id="editPass" type="password"><button class="btn outline small" id="editEye">👁</button></div></div><div class="field"><label class="toggle"><span>Cho thành viên upload</span><input id="editAllow" type="checkbox" ${r.allowUploads!==false?'checked':''}></label></div><div class="modal-actions"><button class="btn outline" id="cancel">Hủy</button><button class="btn primary" id="saveEdit">Lưu thay đổi</button></div>`);$('close').onclick=closeModal;$('cancel').onclick=closeModal;$('editEye').onclick=()=>{$('editPass').type=$('editPass').type==='password'?'text':'password';};$('saveEdit').onclick=saveEditRoom;}
async function saveEditRoom(){const r=state.joined.meta;try{const next={roomName:$('editName').value.trim()||r.roomName,allowUploads:$('editAllow').checked,updatedAt:nowish()};if($('editPass').value.trim())next.passwordHash=await hashPassword($('editPass').value.trim());const merged={...r,...next};const updates={};updates[`rooms/${r.roomId}/meta`]=merged;updates[`users/${auth.currentUser.uid}/rooms/${r.roomId}`]=merged;await update(ref(db),updates);closeModal();toast("✅ Đã cập nhật phòng","good");}catch(e){toast("❌ "+humanError(e),"bad");}}

async function googleLogin(){try{const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});await signInWithPopup(auth,provider);}catch(e){if(e?.code==='auth/popup-blocked'||e?.code==='auth/web-storage-unsupported'||e?.code==='auth/operation-not-supported-in-this-environment'){try{await signInWithRedirect(auth,new GoogleAuthProvider());}catch(x){toast("❌ "+humanError(x),"bad");}}else toast("❌ "+humanError(e),"bad");}}

function bindAuth(){onAuthStateChanged(auth,user=>{state.user=user; if(state.unsubRooms){state.unsubRooms();state.unsubRooms=null;}if(user){renderApp();if(!user.isAnonymous){state.unsubRooms=onValue(ref(db,`users/${user.uid}/rooms`),snap=>{state.rooms=snap.val()||{};if(!state.joined)showHome();});}else{state.rooms={};showHome();}}else{state.user=null;state.rooms={};renderLogin();}});}

async function handleRoute(){const h=location.hash||"";let m=h.match(/^#\/file\/([^/]+)\/([^/]+)$/);if(m){await openSharedFileLink(decodeURIComponent(m[1]),decodeURIComponent(m[2]));return;}m=h.match(/^#room=(.+)$/);if(m){if(auth.currentUser)await enterRoom(decodeURIComponent(m[1]));else openJoinModal(decodeURIComponent(m[1]));return;}}
window.addEventListener('hashchange',handleRoute);

try{await ensureSampleRoom();}catch(e){console.warn(e)}
try{const rr=await getRedirectResult(auth);if(rr?.user)toast("✅ Đăng nhập Google thành công","good");}catch(e){toast("❌ Google redirect: "+humanError(e),"bad");}
bindAuth();
setTimeout(()=>handleRoute(),800);

window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast("❌ "+humanError(e.reason),"bad");});
window.addEventListener('error',e=>{console.error(e.error||e.message);});
</script>
