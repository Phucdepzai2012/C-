<script type="module">

const firebaseConfig={apiKey:'AIzaSyCDQsJ_NrGK5ouRLS7vFr55OBZQ0nKhHSk',authDomain:'vietnam-life-game.firebaseapp.com',databaseURL:'https://vietnam-life-game-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'vietnam-life-game',storageBucket:'vietnam-life-game.firebasestorage.app',messagingSenderId:'134954120781',appId:'1:134954120781:web:d7f762adb80bfce3140e04',measurementId:'G-39VPPE1F9T'};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getDatabase(app);
const COMPILER_URL='https://wandbox.org/api/compile.json';
const COMPILER='gcc-head';
const MAX_RUN_INPUT=200000;

const topics=[
 ['Cơ bản',1,150],['Mảng & duyệt',151,270],['Số học',271,390],['Chuỗi',391,490],['Sắp xếp & tìm kiếm',491,590],['Mảng 2 chiều',591,680],['Prefix / Two pointers',681,760],['Đệ quy / Quay lui',761,830],['Greedy',831,880],['Graph',881,940],['DP',941,990],['HSG tổng hợp',991,1000]
];

const templates=[
 {cat:'Cơ bản',title:'Tổng các số từ 1 đến N',desc:'Cho N. Tính tổng 1+2+...+N.',input:'Một dòng chứa N (1 ≤ N ≤ 10^9).',output:'In tổng.',solve:n=>String(Number(n)*(Number(n)+1)/2),gen:i=>[i+10,i*3+20,i%97+1]},
 {cat:'Cơ bản',title:'Đếm số chẵn',desc:'Cho N số nguyên, đếm bao nhiêu số chẵn.',input:'N (1≤N≤200), sau đó N số nguyên.',output:'Số lượng số chẵn.',solve:a=>String(a.length-1-a.slice(1).filter(x=>Math.abs(Number(x))%2).length),gen:i=>{const n=5+(i%6);return [[n,...Array.from({length:n},(_,j)=>j+i)].flat()] }},
 {cat:'Mảng & duyệt',title:'Giá trị lớn nhất',desc:'Tìm phần tử lớn nhất trong dãy.',input:'N và N số nguyên.',output:'Giá trị lớn nhất.',solve:a=>String(Math.max(...a.slice(1).map(Number))),gen:i=>{const n=6;return [n,...Array.from({length:n},(_,j)=>(j===i%6?999-i:i*3+j-8))]}},
 {cat:'Mảng & duyệt',title:'Giá trị nhỏ nhất',desc:'Tìm phần tử nhỏ nhất trong dãy.',input:'N và N số nguyên.',output:'Giá trị nhỏ nhất.',solve:a=>String(Math.min(...a.slice(1).map(Number))),gen:i=>{const n=6;return [n,...Array.from({length:n},(_,j)=>(j===i%6?-999+i:i*3+j+4))]}},
 {cat:'Số học',title:'Kiểm tra số nguyên tố',desc:'Kiểm tra N có phải số nguyên tố.',input:'Một số nguyên N (2≤N≤10^12).',output:'YES nếu nguyên tố, ngược lại NO.',solve:a=>{const n=Number(a[0]);if(n<2)return'NO';for(let d=2;d*d<=n;d++)if(n%d===0)return'NO';return'YES'},gen:i=>[i%2?97+i:100+i]},
 {cat:'Số học',title:'Ước chung lớn nhất',desc:'Tìm UCLN của A và B.',input:'A B.',output:'UCLN(A,B).',solve:a=>{let x=Math.abs(Number(a[0])),y=Math.abs(Number(a[1]));while(y){[x,y]=[y,x%y]}return String(x)},gen:i=>[48+i,18+(i%15)]},
 {cat:'Số học',title:'Tổng chữ số',desc:'Tính tổng các chữ số của N.',input:'N (0≤N≤10^18).',output:'Tổng chữ số.',solve:a=>String(String(Math.abs(Math.trunc(Number(a[0])))).split('').reduce((s,c)=>s+Number(c),0)),gen:i=>[100000+i*137]},
 {cat:'Số học',title:'Đảo số',desc:'Đảo thứ tự các chữ số của N.',input:'N không âm.',output:'Số sau khi đảo.',solve:a=>String(String(Math.trunc(Number(a[0]))).split('').reverse().join('').replace(/^0+(?=\d)/,'')),gen:i=>[12030+i*11]},
 {cat:'Chuỗi',title:'Đếm nguyên âm',desc:'Đếm a,e,i,o,u trong chuỗi chữ thường.',input:'Một dòng S, không quá 200 ký tự.',output:'Số nguyên âm.',solve:a=>String((a.join(' ').match(/[aeiou]/g)||[]).length),gen:i=>['hello'+(i%5?'world':'aeiou')]},
 {cat:'Chuỗi',title:'Palindrome',desc:'Kiểm tra chuỗi có đối xứng.',input:'Một dòng S.',output:'YES/NO.',solve:a=>{const s=a.join(' ').replace(/\s+/g,' ');return s===s.split('').reverse().join('')?'YES':'NO'},gen:i=>[i%2?'abcba':'abcde']},
 {cat:'Sắp xếp & tìm kiếm',title:'Tìm kiếm tuyến tính',desc:'Tìm xem X có xuất hiện trong dãy.',input:'N, N số, X.',output:'YES/NO.',solve:a=>{const n=Number(a[0]),arr=a.slice(1,n+1).map(Number),x=Number(a[n+1]);return arr.includes(x)?'YES':'NO'},gen:i=>{const n=6;const arr=[3,7,1,9,4,6];return [n,...arr,i%2?7:12]}},
 {cat:'Mảng 2 chiều',title:'Tổng ma trận',desc:'Tính tổng tất cả phần tử ma trận.',input:'M N và M dòng, mỗi dòng N số.',output:'Tổng.',solve:a=>String(a.slice(2).map(Number).reduce((s,x)=>s+x,0)),gen:i=>{const m=2+(i%2),n=3;return [m,n,...Array.from({length:m*n},(_,k)=>k+i%7)]}},
 {cat:'Prefix / Two pointers',title:'Tổng đoạn [L,R]',desc:'Cho dãy và nhiều truy vấn tổng đoạn.',input:'N Q; dãy N số; Q dòng L R (1-index).',output:'Mỗi truy vấn một dòng tổng.',multi:true,solve:tokens=>{let p=0,n=Number(tokens[p++]),q=Number(tokens[p++]);const a=[0];for(let i=0;i<n;i++)a.push(Number(tokens[p++]));const pre=[0];for(let i=1;i<=n;i++)pre[i]=pre[i-1]+a[i];const out=[];for(let z=0;z<q;z++){const l=Number(tokens[p++]),r=Number(tokens[p++]);out.push(String(pre[r]-pre[l-1]))}return out.join('\n')},gen:i=>[5,3,1,2,3,4,5,1,3,2,5,4,4]},
 {cat:'Greedy',title:'Đổi tiền tối thiểu',desc:'Với mệnh giá 1,5,10,20,50, cần ít đồng nhất.',input:'Số tiền N (0≤N≤10^6).',output:'Số đồng ít nhất.',solve:a=>{let n=Number(a[0]),c=0;for(const v of [50,20,10,5,1]){c+=Math.floor(n/v);n%=v}return String(c)},gen:i=>[i*37+63]},
 {cat:'Graph',title:'Đếm thành phần liên thông',desc:'Đồ thị vô hướng, đếm số thành phần.',input:'N M, sau đó M cạnh.',output:'Số thành phần.',multi:true,solve:t=>{let p=0,n=+t[p++],m=+t[p++],g=Array.from({length:n},()=>[]);for(let i=0;i<m;i++){let u=+t[p++]-1,v=+t[p++]-1;g[u].push(v);g[v].push(u)}let c=0,vis=Array(n).fill(0);for(let s=0;s<n;s++)if(!vis[s]){c++;let st=[s];vis[s]=1;while(st.length){let u=st.pop();for(let v of g[u])if(!vis[v])vis[v]=1,st.push(v)}}return String(c)},gen:i=>[6,3,1,2,2,3,4,5]},
 {cat:'DP',title:'Fibonacci modulo',desc:'Tính F(N) mod 1e9+7.',input:'N (0≤N≤1000).',output:'F(N) mod 1000000007.',solve:a=>{let n=+a[0],A=0,B=1;for(let i=0;i<n;i++){[A,B]=[B,(A+B)%1000000007]}return String(A)},gen:i=>[i%50+10]}
];

function buildProblems(){
  const out=[];let id=1;
  while(out.length<1000){
    for(let t=0;t<templates.length && out.length<1000;t++){
      const base=templates[t],k=Math.floor(out.length/templates.length)+1,variant=((out.length)%50)+1;
      out.push({...base,id,title:`${base.title} — biến thể ${variant}`,difficulty:k<=3?'Cơ bản':k<=6?'Trung bình':k<=10?'Khá':'HSG',tags:[base.cat,k<=3?'Dễ':k<=7?'Vừa':'Khó'],variant:k,problemKey:base.title});
    }
  }
  return out.map((p,i)=>({...p,id:i+1}));
}
const problems=buildProblems();
let currentId=1,currentUser=null,score=0,finished={},saveTimer=null;
const $=id=>document.getElementById(id);
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function normalize(s){return String(s??'').replace(/\r/g,'').trim().replace(/\s+$/gm,'')}
function equalOutput(a,b){return normalize(a)===normalize(b)}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function defaultCode(p){return `#include <bits/stdc++.h>\nusing namespace std;\n\nint main(){\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n\n    // Viết lời giải cho bài: ${p.title}\n    return 0;\n}\n`}
function makeCases(p){const cases=[];const targetCount=6;for(let i=0;i<targetCount;i++){let raw=p.gen((p.id+i*7)%997);if(Array.isArray(raw)&&raw.length===1&&Array.isArray(raw[0]))raw=raw[0];if(!Array.isArray(raw))raw=[raw];const input=raw.join(' ');let expected='';try{expected=p.solve(input.split(/\s+/).filter(Boolean));}catch{expected='';}cases.push({input,expected});}return cases}

async function ensureAnonymous(){if(currentUser)return currentUser;try{if(!auth.currentUser)await signInAnonymously(auth);currentUser=auth.currentUser;return currentUser}catch(e){console.warn('Firebase anonymous auth failed',e);return null}}
function localKey(){return `cppHsg9:${currentUser?.uid||'guest'}`}
async function loadCloud(){const u=await ensureAnonymous();if(!u)return;try{const snap=await get(ref(db,`cppLab/${u.uid}`));const d=snap.val()||{};score=Number(d.score||0);finished=d.finished||{};localStorage.setItem(localKey(),JSON.stringify(d));updateScoreUI();const saved=d.code?.[currentId];if(saved) $('code').value=saved}catch(e){loadLocal()}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(localKey())||'{}');score=Number(d.score||0);finished=d.finished||{};updateScoreUI();const saved=d.code?.[currentId];if(saved)$('code').value=saved}catch{}}
async function saveState(){const data={score,finished,code:{[currentId]:$('code').value},updatedAt:Date.now()};let old={};try{old=JSON.parse(localStorage.getItem(localKey())||'{}')}catch{};data.code={...(old.code||{}),[currentId]:$('code').value};localStorage.setItem(localKey(),JSON.stringify(data));const u=await ensureAnonymous();if(!u)return;try{await update(ref(db,`cppLab/${u.uid}`),data)}catch(e){console.warn('Firebase save failed',e)}}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveState,600)}
function updateScoreUI(){ $('scorePill').textContent=`${Math.min(score,1000)} / 1000 điểm`; $('problemScore').textContent=finished[currentId]?'100%':'0%';$('progressBar').style.width=finished[currentId]?'100%':'0%';$('scoreText').textContent=finished[currentId]?'Đã AC — +1 điểm':'Chưa hoàn thành';}
function renderTopics(){let h='<div class="topic active" data-cat="Tất cả">Tất cả <span class="count">1000</span></div>';for(const [name,a,b] of topics)h+=`<div class="topic" data-cat="${name}">${name}<span class="count">${b-a+1}</span></div>`;$('topics').innerHTML=h;document.querySelectorAll('.topic').forEach(x=>x.onclick=()=>{document.querySelectorAll('.topic').forEach(y=>y.classList.remove('active'));x.classList.add('active');renderList(x.dataset.cat,$('search').value)})}
function renderList(cat='Tất cả',q=''){const a=problems.filter(p=>(cat==='Tất cả'||p.cat===cat)&&((p.title+' '+p.cat).toLowerCase().includes(q.toLowerCase())));$('problemList').innerHTML=a.slice(0,220).map(p=>`<div class="problem ${p.id===currentId?'active':''}" data-id="${p.id}"><div class="n">Bài ${p.id} ${finished[p.id]?'· ✓':''}</div><div class="t">${escapeHtml(p.title)}</div><div class="d">${p.difficulty} · ${p.cat}</div></div>`).join('')||'<div class="empty">Không tìm thấy bài.</div>';document.querySelectorAll('.problem').forEach(x=>x.onclick=()=>selectProblem(+x.dataset.id))}
function renderProblem(p){$('problemName').textContent=`Bài ${p.id}. ${p.title}`;$('tags').innerHTML=p.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');$('statement').innerHTML=`<h3>Đề bài</h3><p>${escapeHtml(p.desc)}</p><div class="specgrid"><div class="spec"><b>Dữ liệu vào</b><span>${escapeHtml(p.input)}</span></div><div class="spec"><b>Dữ liệu ra</b><span>${escapeHtml(p.output)}</span></div><div class="spec"><b>Mức độ</b><span>${escapeHtml(p.difficulty)}</span></div><div class="spec"><b>Yêu cầu HSG9</b><span>Ưu tiên thuật toán O(n), O(n log n), tránh brute force khi có thể.</span></div></div>`;$('hint').textContent='Đọc kỹ ràng buộc. HSG9 thường chấm bằng bộ test biên: nhỏ nhất, lớn nhất, dữ liệu lặp, trường hợp đặc biệt.';$('tests').innerHTML='<div class="empty">Chưa nộp bài.</div>';$('output').value='';$('stdin').value=makeCases(p)[0].input;let saved='';try{const d=JSON.parse(localStorage.getItem(localKey())||'{}');saved=d.code?.[p.id]||''}catch{};$('code').value=saved||defaultCode(p);syncLines();updateScoreUI();renderList(document.querySelector('.topic.active')?.dataset.cat||'Tất cả',$('search').value)}
async function selectProblem(id){currentId=id;renderProblem(problems[id-1]);await loadCloud()}

async function callWandbox(code,stdin){
  if(code.length>50000)throw new Error('Code quá dài.');
  if(stdin.length>MAX_RUN_INPUT)throw new Error('Input quá lớn.');
  const payload={compiler:COMPILER,code,stdin,options:'', 'compiler-option-raw':'-std=c++17\n-O2'};
  const res=await fetch(COMPILER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!res.ok)throw new Error(`Compiler HTTP ${res.status}`);
  return res.json();
}
function extractWandbox(r){
  const compile=(r.compiler_error||r.compiler_message||'').trim();
  const out=(r.program_output||r.program_message||'').trim();
  const status=String(r.status??'0');
  if(compile)return {kind:'CE',text:compile,status};
  if(status!=='0')return {kind:'RE',text:(r.program_error||r.program_message||'Chương trình lỗi thời gian chạy.').trim(),status};
  return {kind:'OK',text:out,status};
}
async function runInteractive(){const code=$('code').value,stdin=$('stdin').value;$('output').value='⏳ Đang biên dịch và chạy...';$('runBtn').disabled=true;try{const r=await callWandbox(code,stdin);const x=extractWandbox(r);$('output').value=x.kind==='OK'?(x.text||'(không có output)'):(x.kind+'\n'+x.text)}catch(e){$('output').value='Lỗi compiler: '+e.message}finally{$('runBtn').disabled=false}}
async function submit(){const p=problems[currentId],cases=makeCases(p),code=$('code').value.trim();if(!code){toast('Bạn chưa nhập code');return}$('submitBtn').disabled=true;$('runBtn').disabled=true;$('output').value='⏳ Đang chấm hidden test...';$('tests').innerHTML='';let pass=0;for(let i=0;i<cases.length;i++){const c=cases[i];const row=document.createElement('div');row.className='test';row.innerHTML=`<div class="topline"><b>Test ${i+1}</b><small>running...</small></div>`;$('tests').appendChild(row);try{const r=await callWandbox(code,c.input);const x=extractWandbox(r);const ok=x.kind==='OK'&&equalOutput(x.text,c.expected);if(ok)pass++;row.className='test '+(ok?'ok':'bad');row.innerHTML=`<div class="topline"><b>Test ${i+1} — ${ok?'AC':'WA'}</b><small>${ok?'Đúng':'Sai'}</small></div>${ok?'':`<div class="muted" style="margin-top:5px">Input: ${escapeHtml(c.input)}<br>Expected: ${escapeHtml(c.expected)}<br>Output: ${escapeHtml(x.text)}</div>`}`}catch(e){row.className='test bad';row.innerHTML=`<div class="topline"><b>Test ${i+1} — Error</b><small>${escapeHtml(e.message)}</small></div>`}}
const pct=Math.round(pass*100/cases.length);$('problemScore').textContent=pct+'%';$('progressBar').style.width=pct+'%';$('scoreText').textContent=`${pass}/${cases.length} test đúng`;if(pct===100&&!finished[currentId]){finished[currentId]=true;score=Math.min(1000,score+1);updateScoreUI();await saveState();renderList(document.querySelector('.topic.active')?.dataset.cat||'Tất cả',$('search').value);toast('🎉 AC 100% · +1 điểm')}else if(pct===100){toast('AC 100% · bài đã tính điểm trước đó')}else toast(`Đúng ${pass}/${cases.length} test = ${pct}%`);$('submitBtn').disabled=false;$('runBtn').disabled=false}
function syncLines(){const n=$('code').value.split('\n').length;$('lines').innerHTML=Array.from({length:n},(_,i)=>i+1).join('<br>')}
$('code').addEventListener('input',()=>{syncLines();scheduleSave()});$('code').addEventListener('scroll',()=>{$('lines').scrollTop=$('code').scrollTop});$('stdin').addEventListener('input',scheduleSave);$('runBtn').onclick=runInteractive;$('submitBtn').onclick=submit;$('resetBtn').onclick=()=>{if(confirm('Reset code của bài này?')){$('code').value=defaultCode(problems[currentId-1]);syncLines();scheduleSave()}};$('saveBtn').onclick=()=>saveState().then(()=>toast('Đã lưu code + tiến độ'));
$('search').addEventListener('input',()=>renderList(document.querySelector('.topic.active')?.dataset.cat||'Tất cả',$('search').value));

renderTopics();renderProblem(problems[0]);syncLines();
onAuthStateChanged(auth,u=>{currentUser=u;loadCloud().catch(loadLocal)});ensureAnonymous().catch(()=>{});
</script>
