function subscribeRooms(){if(unsubscribeOwned)unsubscribeOwned();if(unsubscribeJoined)unsubscribeJoined();const uid=currentUser.uid;const ownedRef=ref(db,`users/${uid}/rooms`);const joinedRef=ref(db,`users/${uid}/joinedRooms`);let owned={},joined={};const paint=()=>{const all=[];for(const [id,r] of Object.entries(owned))all.push({...r,role:'Chủ phòng'});for(const [id,r] of Object.entries(joined)){if(!owned[id])all.push({...r,role:'Thành viên'})}const g=$('#roomsGrid');if(!g)return;if(!all.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">Chưa có phòng. Hãy tạo hoặc tham gia một phòng.</div>';return}g.innerHTML=all.sort((a,b)=>(b.updatedAt||b.joinedAt||0)-(a.updatedAt||a.joinedAt||0)).map(roomCard).join('')};
unsubscribeOwned=onValue(ownedRef,s=>{owned=s.val()||{};paint()},e=>toast('Không tải được phòng của bạn: '+errMsg(e),'error'));
unsubscribeJoined=onValue(joinedRef,s=>{joined=s.val()||{};paint()},e=>toast('Không tải được phòng đã tham gia: '+errMsg(e),'error'));
}

async function createRoom(btn){btn.disabled=true;try{const name=normalizeName($('#newRoomName').value);const pass=$('#newRoomPass').value.trim();if(pass.length<4)throw new Error('Mật khẩu phải có ít nhất 4 ký tự.');const roomId=await uniqueRoomId();const now=Date.now();const hash=await sha256(pass);const room={roomId,roomName:name,passwordHash:hash,ownerUid:currentUser.uid,ownerEmail:currentUser.email||'',ownerName:currentUser.displayName||'Chủ phòng',createdAt:now,updatedAt:now,allowUploads:true};await set(ref(db,`rooms/${roomId}/meta`),room);await set(ref(db,`users/${currentUser.uid}/rooms/${roomId}`),room).catch(()=>set(ref(db,`users/${currentUser.uid}/rooms/${roomId}`),room));await set(ref(db,`users/${currentUser.uid}/rooms/${roomId}`),room);toast('✅ Tạo phòng thành công','success');btn.closest('.modal').remove();location.hash=`#/room/${roomId}`;navigate()}catch(e){toast('❌ '+errMsg(e),'error');btn.disabled=false}}

async function loadRoom(id){currentRoomId=id;currentRoomMeta=null;currentFiles={};cleanupRoomSubs();try{const s=await get(ref(db,`rooms/${id}/meta`));if(!s.exists()){showError('Không tìm thấy phòng','Mã phòng không tồn tại hoặc phòng đã bị xóa.');return}const meta=s.val();let hasAccess=false;if(currentUser){if(meta.ownerUid===currentUser.uid)hasAccess=true;else{const j=await get(ref(db,`users/${currentUser.uid}/joinedRooms/${id}`));hasAccess=j.exists()}}if(!hasAccess){renderPasswordGate(meta);return}currentRoomMeta=meta;renderRoom();subscribeRoom(id)}catch(e){showError('Không thể mở phòng',errMsg(e))}}
function renderPasswordGate(meta){renderShell(`<main class="container"><div class="card auth-card"><h1 class="auth-title">🔐 ${esc(meta.roomName)}</h1><p>Phòng này cần xác thực. Nhập mật khẩu phòng để vào.</p><div class="form-grid"><div><label class="label">Mã phòng</label><input class="input" value="${esc(meta.roomId)}" readonly></div><div><label class="label">Mật khẩu</label><div class="input-row"><input id="gatePass" class="input" type="password"><button class="btn btn-secondary" onclick="toggleField('gatePass',this)">👁</button></div></div></div><div class="modal-actions" style="justify-content:flex-start"><button class="btn btn-primary" onclick="authenticateRoom('${esc(meta.roomId)}')">Vào phòng</button><button class="btn btn-secondary" onclick="location.hash='/'">← Trang chủ</button></div></div></main>`)}
async function authenticateRoom(id){try{await ensureUserForRoom();const pass=$('#gatePass').value;const s=await get(ref(db,`rooms/${id}/meta`));if(!s.exists())throw new Error('Không tìm thấy phòng.');const meta=s.val();if(await sha256(pass)!==meta.passwordHash)throw new Error('❌ Sai mật khẩu.');await set(ref(db,`users/${currentUser.uid}/joinedRooms/${id}`),{roomId:id,roomName:meta.roomName,ownerUid:meta.ownerUid,ownerEmail:meta.ownerEmail||'',ownerName:meta.ownerName||'',joinedAt:Date.now(),role:meta.ownerUid===currentUser.uid?'owner':'member'});currentRoomMeta=meta;renderRoom();subscribeRoom(id);toast('✅ Đã xác thực phòng','success')}catch(e){toast(''+errMsg(e),'error')}}
function cleanupRoomSubs(){if(roomMetaUnsub)roomMetaUnsub();if(filesUnsub)filesUnsub();roomMetaUnsub=null;filesUnsub=null}
function subscribeRoom(id){cleanupRoomSubs();roomMetaUnsub=onValue(ref(db,`rooms/${id}/meta`),s=>{if(!s.exists()){showError('Phòng đã bị xóa','Phòng không còn tồn tại.');return}currentRoomMeta=s.val();renderRoom();},e=>toast('Lỗi realtime phòng: '+errMsg(e),'error'));filesUnsub=onValue(ref(db,`rooms/${id}/filesMeta`),s=>{currentFiles=s.val()||{};renderFileCards();},e=>toast('Lỗi realtime file: '+errMsg(e),'error'))}
function renderRoom(){renderShell(`<div class="room-page-head"><div class="container room-head"><button class="btn btn-secondary back-btn" onclick="location.hash='/'">←</button><div class="room-heading"><h2>🏠 ${esc(currentRoomMeta?.roomName||'Phòng')}</h2><div class="room-code">Mã phòng: <b>${esc(currentRoomId)}</b></div></div><div class="room-tools"><button class="btn btn-secondary btn-small" onclick="copyText('${esc(currentRoomId)}','Đã copy mã phòng')">Copy mã</button><button class="btn btn-secondary btn-small" onclick="copyRoomLink()">Copy link phòng</button>${canOwner()?`<button class="btn btn-secondary btn-small" onclick="openRoomSettings()">⚙ Quản lý</button>`:''}<button class="btn btn-primary btn-small" onclick="location.hash='/'">⌂ Về trang chủ</button></div></div></div><main class="container"><div class="room-layout"><aside class="sidebar-card"><div class="sidebar-label">Thông tin phòng</div><div style="font-weight:800;margin-bottom:12px">${esc(currentRoomMeta?.roomName||'')}</div><div class="room-meta">Chủ: ${esc(currentRoomMeta?.ownerName||currentRoomMeta?.ownerEmail||'')}<br>Tạo: ${fmtDate(currentRoomMeta?.createdAt)}<br>Upload: ${currentRoomMeta?.allowUploads===false?'Tắt':'Bật'}</div>${canOwner()?`<div style="margin-top:16px"><div class="sidebar-label">Mật khẩu hiện tại</div><div class="password-box"><div id="ownerPass" class="password-value">••••••••</div><button class="btn btn-secondary btn-small" onclick="toggleOwnerPassword()" id="ownerPassBtn">👁</button></div><div class="sidebar-actions"><button class="btn btn-secondary btn-small" onclick="copyOwnerPassword()">Copy</button><button class="btn btn-primary btn-small" onclick="openChangePassword()">Đổi mật khẩu</button></div><div class="small muted" style="margin-top:8px">Mật khẩu thật chỉ được giữ trong phiên quản trị trình duyệt này sau khi bạn xác thực/đổi.</div></div>`:''}</aside><section><div id="dropzone" class="dropzone"><div class="upload-icon">☁️</div><h3>Thả file vào đây</h3><p>Hoặc chọn file từ máy. Upload từng chunk 64 KB, có retry tự động.</p>${canUpload()?`<label class="btn btn-primary">Chọn file<input id="fileInput" type="file" multiple hidden></label>`:`<div class="muted">Chủ phòng đã tắt upload cho thành viên.</div>`}</div><div id="uploadList" class="upload-list"></div><div class="section-head" style="margin-top:24px"><h3 class="section-title">FILE TRONG PHÒNG</h3><span class="muted small">Realtime</span></div><div id="fileGrid" class="file-grid"></div></section></div></main>`);setupDropzone();renderFileCards()}
function setupDropzone(){const dz=$('#dropzone'),input=$('#fileInput');if(!dz||!input)return;input.addEventListener('change',()=>handleFiles([...input.files]));['dragenter','dragover'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',x=>{if(!canUpload()){toast('Upload đang bị tắt.','warn');return}handleFiles([...x.dataTransfer.files])})}
function uploadItem(file){const id='up_'+crypto.randomUUID();$('#uploadList').insertAdjacentHTML('beforeend',`<div id="${id}" class="upload-item"><div class="upload-top"><strong>${esc(file.name)}</strong><span>0%</span></div><div class="progress"><span></span></div><div class="status">Chuẩn bị...</div></div>`);return {id,row:$('#'+id)}}
function setUploadProgress(u,p,status){const bar=u.row.querySelector('.progress>span'),pct=u.row.querySelector('.upload-top span'),st=u.row.querySelector('.status');bar.style.width=p+'%';pct.textContent=Math.round(p)+'%';st.textContent=status}
async function retryTask(task,label){let last;for(let a=1;a<=MAX_RETRIES;a++){try{return await withTimeout(task(),15000)}catch(e){last=e;if(a<MAX_RETRIES)await new Promise(r=>setTimeout(r,RETRY_BASE*a))}}throw last||new Error(label+' thất bại')}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout')),ms))])}
function toBase64(bytes){let bin='';const step=0x8000;for(let i=0;i<bytes.length;i+=step)bin+=String.fromCharCode(...bytes.subarray(i,i+step));return btoa(bin)}
async function handleFiles(files){if(uploading){toast('Đang upload file, vui lòng chờ tiến trình hiện tại.','warn');return}if(!canUpload()){toast('Bạn không có quyền upload trong phòng này.','error');return}for(const file of files){try{await uploadFile(file)}catch(e){toast('❌ '+file.name+': '+errMsg(e),'error')}}}
async function uploadFile(file){
 if(file.size>8*1024*1024){toast('⚠️ File > 8 MB sẽ làm RTDB nặng và chậm hơn.','warn')}
 uploading=true;
 const u=uploadItem(file);
 try{
  if(!currentUser)throw new Error('Chưa đăng nhập.');
  const fileId=crypto.randomUUID().replaceAll('-','');
  const total=Math.max(1,Math.ceil(file.size/CHUNK_SIZE));
  const now=Date.now();
  const meta={fileId,name:file.name,size:file.size,contentType:file.type||'application/octet-stream',totalChunks:total,chunkSize:CHUNK_SIZE,createdAt:now,uploaderUid:currentUser.uid,uploaderName:currentUser.displayName||'Khách'};

  // Ghi metadata trước để realtime biết file đang xuất hiện.
  await retryTask(()=>set(ref(db,`rooms/${currentRoomId}/filesMeta/${fileId}`),meta),'Lưu metadata');

  let completed=0;
  let nextBatch=0;
  const batchCount=Math.ceil(total/UPLOAD_BATCH_SIZE);

  async function writeBatch(batchIndex){
    const first=batchIndex*UPLOAD_BATCH_SIZE;
    const last=Math.min(total,first+UPLOAD_BATCH_SIZE);
    const payload={};
    const buffers=await Promise.all(Array.from({length:last-first},async(_,offset)=>{
      const i=first+offset;
      const start=i*CHUNK_SIZE;
      const end=Math.min(file.size,start+CHUNK_SIZE);
      const bytes=new Uint8Array(await file.slice(start,end).arrayBuffer());
      return [i,bytes];
    }));
    for(const [i,bytes] of buffers)payload[String(i)]=toBase64(bytes);

    setUploadProgress(u,Math.max(1,(completed/total)*100),`⚡ Đang gửi ${first+1}-${last}/${total}...`);
    await retryTask(()=>update(ref(db,`rooms/${currentRoomId}/fileData/${fileId}`),payload),`Chunk ${first+1}-${last}`);
    completed+=last-first;
    setUploadProgress(u,(completed/total)*100,`⚡ Đã lưu ${completed}/${total} chunk`);
  }

  async function worker(){
    while(true){
      const b=nextBatch++;
      if(b>=batchCount)return;
      try{
        await writeBatch(b);
      }catch(e){
        const first=b*UPLOAD_BATCH_SIZE+1;
        const last=Math.min(total,(b+1)*UPLOAD_BATCH_SIZE);
        setUploadProgress(u,(completed/total)*100,`Chunk ${first}-${last}/${total} thất bại – đang thử lại...`);
        throw e;
      }
    }
  }

  const workerCount=Math.min(UPLOAD_CONCURRENCY,batchCount);
  await Promise.all(Array.from({length:workerCount},worker));
  await retryTask(()=>update(ref(db),{[`rooms/${currentRoomId}/meta/updatedAt`]:Date.now()}),'Cập nhật phòng');
  setUploadProgress(u,100,'✅ Upload siêu nhanh hoàn tất');
  // File vẫn còn trong trình duyệt sau khi upload. Cache ngay Blob gốc để bấm Xem gần như tức thì.
  try{ await cacheBlob({...meta,updatedAt:now},file); }catch(cacheErr){ console.warn('Local upload cache:',cacheErr); }
  toast('✅ Upload thành công: '+file.name,'success');
  setTimeout(()=>u.row.remove(),2500);
 }catch(e){
  setUploadProgress(u,Math.max(0,Number((u.row.querySelector('.progress>span')?.style.width||'0').replace('%',''))||0),'❌ Upload thất bại: '+errMsg(e));
  throw e;
 }finally{uploading=false}
}
function previewKind(name){const e=ext(name);if(['mp4','webm','mov','m4v','avi'].includes(e))return 'video';if(['mp3','wav','ogg','m4a','aac'].includes(e))return 'audio';if(['jpg','jpeg','png','gif','webp','svg','bmp','avif'].includes(e))return 'image';return 'generic'}

async function readAllChunksFast(meta,onProgress){

  let loaded=0;
  // File nhỏ: lấy cả node trong một request, giảm overhead.
  if(total<=48){
    const parent=await retryTask(()=>get(ref(db,`rooms/${roomId}/fileData/${meta.fileId}`)),`Đọc dữ liệu ${meta.name}`);
    if(!parent.exists())throw new Error('Không tìm thấy dữ liệu file.');
    const data=parent.val()||{};
    for(let i=0;i<total;i++){
      const value=data[String(i)];
      if(typeof value!=='string')throw new Error(`Thiếu chunk ${i+1}/${total}.`);
      parts[i]=decodeBase64(value);
      loaded++; onProgress?.(loaded,total);

    let cursor=0; const concurrency=Math.min(10,total);

async function transcodeVideoBlob(blob,res,onProgress){const video=document.createElement('video');video.muted=false;video.playsInline=true;video.src=URL.createObjectURL(blob);await new Promise((ok,fail)=>{video.onloadedmetadata=ok;video.onerror=fail});const [tw,th]=res.split('x').map(Number);const {w,h}=clampResolution(video.videoWidth,video.videoHeight,tw,th);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');const canvasStream=canvas.captureStream(30);let sourceStream=null;try{sourceStream=video.captureStream()}catch{};const stream=new MediaStream(canvasStream.getVideoTracks());if(sourceStream){sourceStream.getAudioTracks().forEach(t=>stream.addTrack(t))}const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){URL.revokeObjectURL(video.src);throw new Error('Trình duyệt không hỗ trợ tạo video độ phân giải mới. Hãy dùng Chrome/Edge mới.')}const chunks=[];const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.max(1200000,Math.min(24000000,w*h*3))});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const stopped=new Promise((ok,fail)=>{rec.onstop=ok;rec.onerror=()=>fail(rec.error||new Error('MediaRecorder lỗi'))});video.currentTime=0;await video.play();rec.start(250);await new Promise((ok,fail)=>{const tick=()=>{if(video.ended)return ok();onProgress?.(video.duration?video.currentTime/video.duration:0);requestAnimationFrame(tick)};video.onerror=fail;tick()});rec.stop();await stopped;video.pause();stream.getTracks().forEach(t=>t.stop());URL.revokeObjectURL(video.src);return new Blob(chunks,{type:mime})}
async function applyImageResolution(meta,blob,res,mount){try{const out=await resizeImageBlob(blob,res);if(!out)throw new Error('Không tạo được ảnh mới.');const url=URL.createObjectURL(out);const fileName=meta.name.replace(/\.[^.]+$/,'')+'-'+res+'.webp';mount.querySelector('.media-stage img')?.remove();const img=document.createElement('img');img.src=url;img.alt='';img.title=fileName;mount.querySelector('.media-stage').appendChild(img);let dl=mount.querySelector('.resolution-download');if(!dl){dl=document.createElement('button');dl.className='btn btn-primary btn-small resolution-download';mount.querySelector('.quality-bar').appendChild(dl)}dl.textContent=`⬇ Tải ${fileName}`;dl.onclick=()=>{const a=document.createElement('a');a.href=url;a.download=fileName;a.click()};toast(`✅ Đã tạo ảnh ${res}`,'success')}catch(e){toast('❌ Đổi độ phân giải ảnh: '+errMsg(e),'error')}}
async function applyVideoResolution(meta,blob,res,mount){const bar=mount.querySelector('.quality-bar');const btn=bar.querySelector('button');const note=bar.querySelector('.quality-note');btn.disabled=true;note.textContent='Đang mã hóa… 0%';try{const out=await transcodeVideoBlob(blob,res,p=>{note.textContent=`Đang mã hóa… ${Math.round(p*100)}%`});const url=URL.createObjectURL(out);const old=mount.querySelector('video');const v=document.createElement('video');v.src=url;v.controls=true;v.autoplay=true;v.playsInline=true;v.preload='auto';old?.replaceWith(v);let dl=mount.querySelector('.resolution-download');if(!dl){dl=document.createElement('button');dl.className='btn btn-primary btn-small resolution-download';bar.appendChild(dl)}const base=meta.name.replace(/\.[^.]+$/,'');const fileName=base+'-'+res+'.webm';dl.textContent=`⬇ Tải ${fileName}`;dl.onclick=()=>{const a=document.createElement('a');a.href=url;a.download=fileName;a.click()};note.textContent=`✅ Bản ${res} đã sẵn sàng (${fmtSize(out.size)})`;toast(`✅ Đã tạo video ${res}`,'success')}catch(e){note.textContent='❌ '+errMsg(e);toast('❌ Đổi độ phân giải video: '+errMsg(e),'error')}finally{btn.disabled=false}}

async function openBlobViewerInto(mount,meta,blob){const e=ext(meta.name);const url=URL.createObjectURL(blob);
 if(['mp4','webm','mov','m4v','avi'].includes(e)){const stage=document.createElement('div');stage.className='media-stage';const bar=makeQualityBar('video',res=>applyVideoResolution(meta,blob,res,mount));const video=document.createElement('video');video.src=url;video.controls=true;video.autoplay=true;video.playsInline=true;video.preload='auto';stage.append(bar,video);mount.replaceChildren(stage);return}
 if(['mp3','wav','ogg','m4a','aac'].includes(e)){mount.innerHTML=`<audio src="${url}" controls autoplay preload="auto"></audio>`;return}
 if(['jpg','jpeg','png','gif','webp','svg','bmp','avif'].includes(e)){const stage=document.createElement('div');stage.className='media-stage';const bar=makeQualityBar('image',res=>applyImageResolution(meta,blob,res,mount));const img=document.createElement('img');img.src=url;img.alt='';stage.append(bar,img);mount.replaceChildren(stage);return}
 if(e==='pdf'){const pdfUrl=URL.createObjectURL(new Blob([blob],{type:'application/pdf'}));mount.innerHTML=`<iframe class="viewer-pdf" title="PDF viewer" src="${pdfUrl}"></iframe>`;return}
 if(['txt','md','log','json','csv','xml','html','css','js'].includes(e)){const text=await blob.text();mount.innerHTML=`<pre class="text-view">${esc(text)}</pre>`;return}
 if(e==='docx'){if(!window.mammoth)throw new Error('Word viewer chưa tải xong.');const ab=await blob.arrayBuffer();const result=await window.mammoth.convertToHtml({arrayBuffer:ab});mount.innerHTML=`<article class="docx-view">${result.value}</article>`;return}
 if(['xlsx','xls','csv'].includes(e)){if(!window.XLSX)throw new Error('Excel viewer chưa tải xong.');const ab=await blob.arrayBuffer();const wb=XLSX.read(ab,{type:'array'});const wrap=document.createElement('div');wrap.className='sheet-wrap';const tabs=document.createElement('div');tabs.className='sheet-tabs';const tableBox=document.createElement('div');wrap.append(tabs,tableBox);wb.SheetNames.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{tabs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tableBox.innerHTML=XLSX.utils.sheet_to_html(wb.Sheets[name],{header:'',footer:''});tableBox.querySelector('table')?.classList.add('sheet-table')};if(i===0)b.classList.add('active');tabs.appendChild(b)});tableBox.innerHTML=XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]],{header:'',footer:''});tableBox.querySelector('table')?.classList.add('sheet-table');mount.appendChild(wrap);return}
 if(e==='pptx'){if(!window.PptxViewJS)throw new Error('PowerPoint viewer chưa tải xong.');const wrap=document.createElement('div');wrap.className='ppt-wrap';const canvas=document.createElement('canvas');canvas.className='ppt-canvas';canvas.width=1280;canvas.height=720;const controls=document.createElement('div');controls.className='ppt-controls';const prev=document.createElement('button');prev.className='btn btn-secondary btn-small';prev.textContent='← Trước';const next=document.createElement('button');next.className='btn btn-secondary btn-small';next.textContent='Sau →';const stat=document.createElement('span');stat.textContent='Đang tải...';controls.append(prev,stat,next);wrap.append(canvas,controls);mount.appendChild(wrap);const {PPTXViewer}=window.PptxViewJS;const viewer=new PPTXViewer({canvas});await viewer.loadFile(new File([blob],meta.name,{type:meta.contentType||'application/vnd.openxmlformats-officedocument.presentationml.presentation'}));await viewer.render();stat.textContent=`Slide ${viewer.getCurrentSlideIndex()+1} / ${viewer.getSlideCount()}`;prev.onclick=async()=>{await viewer.previousSlide();await viewer.render();stat.textContent=`Slide ${viewer.getCurrentSlideIndex()+1} / ${viewer.getSlideCount()}`};next.onclick=async()=>{await viewer.nextSlide();await viewer.render();stat.textContent=`Slide ${viewer.getCurrentSlideIndex()+1} / ${viewer.getSlideCount()}`};return}
 mount.innerHTML=`<div class="card" style="max-width:620px;text-align:center"><div style="font-size:50px">${typeIcon(meta.name)}</div><h3>${esc(meta.name)}</h3><p class="muted">Trình duyệt chưa có viewer trực tiếp cho định dạng này.</p><button class="btn btn-primary" onclick="downloadFile('${esc(meta.fileId)}')">Tải file để mở bằng ứng dụng trên máy</button></div>`;
}

async function openFileFromLink(roomId,fileId){currentRoomId=roomId;try{const s=await get(ref(db,`rooms/${roomId}/meta`));if(!s.exists())return showError('Không tìm thấy phòng','Phòng chứa file này không tồn tại.');const meta=s.val();let access=currentUser&&(meta.ownerUid===currentUser.uid);if(!access&&currentUser){access=(await get(ref(db,`users/${currentUser.uid}/joinedRooms/${roomId}`))).exists()}if(!access){renderFileGate(meta,roomId,fileId);return}const fm=await get(ref(db,`rooms/${roomId}/filesMeta/${fileId}`));if(!fm.exists())return showError('Không tìm thấy file','File có thể đã bị xóa.');const f=fm.val();f._roomId=roomId;await viewMetaExternal(roomId,f)}catch(e){showError('Không thể mở link file',errMsg(e))}}
function renderFileGate(meta,roomId,fileId){renderShell(`<main class="container"><div class="card auth-card"><h1 class="auth-title">${typeIcon('x')} ${esc(meta.roomName)}</h1><p>Link file đã được tạo tự động. Nhập mật khẩu phòng để xem file.</p><div class="room-meta" style="margin-bottom:15px">Mã phòng: <b>${esc(roomId)}</b><br>File: <b>${esc(fileId)}</b></div><div><label class="label">Mật khẩu phòng</label><div class="input-row"><input id="fileGatePass" class="input" type="password"><button class="btn btn-secondary" onclick="toggleField('fileGatePass',this)">👁</button></div></div><div class="modal-actions" style="justify-content:flex-start"><button class="btn btn-primary" onclick="authFileGate('${esc(roomId)}','${esc(fileId)}')">Xem file</button><button class="btn btn-secondary" onclick="location.hash='/'">← Về trang chủ</button></div></div></main>`)}
async function authFileGate(roomId,fileId){try{await ensureUserForRoom();const pass=$('#fileGatePass').value;const ms=await get(ref(db,`rooms/${roomId}/meta`));if(!ms.exists())throw new Error('Không tìm thấy phòng.');const meta=ms.val();if(await sha256(pass)!==meta.passwordHash)throw new Error('❌ Sai mật khẩu.');await set(ref(db,`users/${currentUser.uid}/joinedRooms/${roomId}`),{roomId,roomName:meta.roomName,ownerUid:meta.ownerUid,ownerEmail:meta.ownerEmail||'',ownerName:meta.ownerName||'',joinedAt:Date.now(),role:meta.ownerUid===currentUser.uid?'owner':'member'});const fm=await get(ref(db,`rooms/${roomId}/filesMeta/${fileId}`));if(!fm.exists())throw new Error('File không tồn tại.');const f=fm.val();f._roomId=roomId;await viewMetaExternal(roomId,f)}catch(e){toast('❌ '+errMsg(e),'error')}}
async function viewMetaExternal(roomId,meta){const oldRoom=currentRoomId;currentRoomId=roomId;const viewer=makeLoadingViewer(meta);try{const cached=await getCachedBlob(meta);if(cached){await openBlobViewerInto(viewer.mount,meta,cached);viewer.status.remove();return}const blob=await readAllChunksFast(meta,(done,total)=>{viewer.status.textContent=total>1?`Đang tải ${done}/${total} (${Math.round(done/total*100)}%)`:'Đang chuẩn bị file...';viewer.progress.style.width=Math.max(8,done/total*100)+'%'});await cacheBlob(meta,blob);await openBlobViewerInto(viewer.mount,meta,blob);viewer.status.remove()}catch(e){viewer.status.textContent='❌ '+errMsg(e);toast('❌ Không mở được file: '+errMsg(e),'error')}finally{currentRoomId=oldRoom||roomId}}
function navigate(){cleanupRoomSubs();const raw=location.hash.replace(/^#\/?/,'');if(!raw){renderHome();return}const parts=raw.split('/').filter(Boolean).map(decodeURIComponent);if(parts[0]==='room'&&parts[1])loadRoom(normalizeRoomId(parts[1]));else if(parts[0]==='file'&&parts[1]&&parts[2])openFileFromLink(normalizeRoomId(parts[1]),parts[2]);else if(parts[0]==='join'){openJoinRoom();renderHome()}else{renderHome();}}

// Expose UI methods required by inline handlers.
Object.assign(window,{loginGoogle,loginAnonymous,logoutUser,openCreateRoom,createRoom,openJoinRoom,joinRoom,deleteRoom,openRoom,toggleField,authenticateRoom,copyRoomLink,copyFileLink,copyText,viewFile,downloadFile,deleteFile,openRoomSettings,saveRoomSettings,openChangePassword,changePassword,toggleOwnerPassword,copyOwnerPassword,closeViewer,authFileGate});

// Best-effort keyboard/context protection. It does not provide true source-code secrecy on a client-only site.
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.key==='F12'||(e.ctrlKey&&k==='u')||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))){e.preventDefault();e.stopPropagation();toast('🔒 Thao tác này bị chặn trong RoomDrive.','warn')}},true);

getRedirectResult(auth).catch(e=>{if(e)toast('Đăng nhập redirect lỗi: '+errMsg(e),'error')});
onAuthStateChanged(auth,user=>{currentUser=user;renderHome()});
window.addEventListener('hashchange',navigate);
window.addEventListener('load',()=>{if(!location.hash)location.hash='/';else navigate()});
</script>
